user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format for Loki/Promtail
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 0;

    # Gzip for package files
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/octet-stream application/x-gzip application/x-bzip2 application/x-xz;

    # Mirror-specific
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Directory listing for repo browsing
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header Referrer-Policy no-referrer-when-downgrade;

        # Cache static assets
        location ~* \.(db|files|sig|tar\.(gz|xz|zst))$ {
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Mirror status endpoint
        location /mirror-status {
            access_log off;
            alias /usr/share/nginx/html/;
            try_files /mirror-status.txt =404;
        }

        # Block access to sensitive files
        location ~ /\. {
            deny all;
        }
    }
}