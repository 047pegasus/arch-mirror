# Additional mirror-specific configuration
server {
    listen 80;
    server_name arch.itanishq.space mirror.itanishq.space;

    # Redirect HTTP to HTTPS (Cloudflare handles TLS)
    # This is handled by Cloudflare, but keep for direct access

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;
    }

    # Repository metadata - ensure fresh
    location ~* /(core|extra|community|multilib)/.*\.db$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }

    # Package files - long cache
    location ~* /(core|extra|community|multilib)/.*\.pkg\.tar\.(gz|xz|zst)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ISO files
    location /iso/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}